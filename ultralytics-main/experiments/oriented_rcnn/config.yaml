# Oriented R-CNN 对比实验配置
# 使用 DOTAv2.0 数据集，与 YOLO_DDBC 实验保持一致

# 实验名称
name: oriented_rcnn_dota

# 数据集配置
data:
  path: data/DOTAv2.0  # 数据集路径
  train: train
  val: val
  test: test
  nc: 15  # DOTAv2.0 类别数

# 模型配置
model:
  type: oriented_rcnn
  backbone: resnet50  # 或 resnet101
  num_classes: 15

# 训练配置
train:
  epochs: 300
  batch_size: 4
  imgsz: 1024  # 输入图像尺寸
  lr0: 0.01  # 初始学习率
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  workers: 4

# 验证配置
val:
  imgsz: 1024
  batch_size: 4

# 评估指标
metrics:
  - mAP@0.5
  - mAP@0.5:0.95

