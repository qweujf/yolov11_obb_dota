# Ultralytics 🚀 AGPL-3.0 License
# YOLO11-OBB baseline + SFE-DRB modules (replace MCA positions), Head unchanged

nc: 18  # DOTA-v2.0 classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  # SFE-DRB #1 at P3/8 uses P2/4 (idx 1) as high-res input
  - [[-1, 1], 1, SFE_DRB, [256, True]]   # 3
  - [-1, 1, Conv, [256, 3, 2]]      # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  # SFE-DRB #2 at P4/16 uses P3/8 (idx 4) as high-res input
  - [[-1, 4], 1, SFE_DRB, [512, True]]   # 6
  - [-1, 1, Conv, [512, 3, 2]]      # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  # SFE-DRB #3 at P4/16 uses P3/8 (idx 4) as high-res input
  - [[-1, 4], 1, SFE_DRB, [512, True]]   # 9
  - [-1, 1, Conv, [1024, 3, 2]]     # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 12
  - [-1, 2, C2PSA, [1024]]          # 13
  # SFE-DRB #4 at P5/32 uses P4/16 (idx 7) as high-res input
  - [[-1, 7], 1, SFE_DRB, [1024, True]]  # 14

head:
  # Keep standard FPN head structure (unchanged C3k2)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 7], 1, Concat, [1]]                    # 16 cat backbone P4 (idx 7)
  - [-1, 2, C3k2, [512, False]]                  # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 4], 1, Concat, [1]]                    # 19 cat backbone P3 (idx 4)
  - [-1, 2, C3k2, [256, False]]                  # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 21
  - [[-1, 17], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [512, False]]                  # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 24
  - [[-1, 14], 1, Concat, [1]]                   # 25 cat backbone SFE-DRB #4 out
  - [-1, 2, C3k2, [1024, True]]                  # 26 (P5/32-large)

  - [[20, 23, 26], 1, OBB, [nc, 1]]              # 27 Detect(P3, P4, P5)

