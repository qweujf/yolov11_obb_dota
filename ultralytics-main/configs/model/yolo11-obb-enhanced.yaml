# Enhanced YOLO11-obb with Multi-Scale Cross-Axis Attention and Adaptive FPN
# 增强版YOLOv11-OBB模型，集成多尺度交叉轴注意力机制和自适应特征金字塔网络
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 18 # DOTA-v2.0数据集类别数
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 196 layers, 2695747 parameters, 2695731 gradients, 6.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 196 layers, 9744931 parameters, 9744915 gradients, 22.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 246 layers, 20963523 parameters, 20963507 gradients, 72.2 GFLOPs
  l: [1.00, 1.00, 512] # summary: 372 layers, 26220995 parameters, 26220979 gradients, 91.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 372 layers, 58875331 parameters, 58875315 gradients, 204.3 GFLOPs

# Enhanced YOLO11n backbone with MCAttention
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, MCAttention, [256, 256, (3, 5, 7), 16, 8]] # 3-多尺度交叉轴注意力
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, MCAttention, [512, 512, (3, 5, 7), 16, 8]] # 6-多尺度交叉轴注意力
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, MCAttention, [512, 512, (3, 5, 7), 16, 8]] # 9-多尺度交叉轴注意力
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 2, C2PSA, [1024]] # 13-原始PSA注意力
  - [-1, 1, MCAttention, [1024, 1024, (3, 5, 7, 9), 16, 8]] # 14-增强的多尺度注意力

# Enhanced YOLO11n head with Adaptive FPN
head:
  # 自适应特征金字塔网络
  - [-1, 1, AdaptiveFPN, [[1024, 512, 256], 256]] # 15-自适应FPN
  
  # 上采样和特征融合
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 18
  - [-1, 1, SCAttention, [512, 512, 16]] # 19-空间通道注意力

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)
  - [-1, 1, SCAttention, [256, 256, 16]] # 23-空间通道注意力

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 26 (P4/16-medium)
  - [-1, 1, SCAttention, [512, 512, 16]] # 27-空间通道注意力

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 30 (P5/32-large)
  - [-1, 1, SCAttention, [1024, 1024, 16]] # 31-空间通道注意力

  - [[22, 26, 30], 1, OBB, [nc, 1]] # Detect(P3, P4, P5)

