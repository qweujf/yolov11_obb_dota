# YOLO11-OBB with GhostNet Backbone
# Complete backbone replacement with GhostNet (GhostConv + C3Ghost)
# Removed C3k2_ROAM and SFE_DRB for lightweight design

nc: 18  # DOTA-v2.0 classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# GhostNet Backbone (complete replacement)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C3Ghost, [128, True]]    # 2: C3Ghost module
  - [-1, 1, GhostConv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C3Ghost, [256, True]]    # 4: C3Ghost module
  - [-1, 1, GhostConv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C3Ghost, [512, True]]    # 6: C3Ghost module
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C3Ghost, [1024, True]]    # 8: C3Ghost module
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10: PSA attention

# YOLO11n-obb head (standard FPN, can optionally use C3Ghost for further lightweight)
head:
  # 上采样 P5，与 P4 拼接
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12: cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13 (FPN P4)

  # 上采样 P4，与 P3 拼接
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15: cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16 (P3/8-small)

  # 下采样 P3，与 P4 拼接
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18: cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 19 (P4/16-medium)

  # 下采样 P4，与 P5 拼接
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21: cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 22 (P5/32-large)

  # OBB detection head on three scales (P3/P4/P5)
  - [[16, 19, 22], 1, OBB, [nc, 1]]              # 23: Detect on P3, P4, P5

