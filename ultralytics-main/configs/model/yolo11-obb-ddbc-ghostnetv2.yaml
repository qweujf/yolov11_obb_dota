# YOLO11-OBB DDBC with GhostNetV2 Backbone
# YOLO_DDBC 模型的轻量化版本：将骨干网络替换为 GhostNetV2
# Backbone: GhostNetV2 (GhostConv + C3Ghost + DFC Attention)
# Neck: DDPG + BiFPN_DWC (保持不变)
# Head: Standard Detection Head (保持不变)
# Loss: CSL_ProbIoU (训练时自动使用)

nc: 18  # DOTA-v2.0 classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# GhostNetV2 Backbone (complete replacement)
# Structure: Conv → GhostConv → C3Ghost → DFC Attention → 
#            GhostConv → C3Ghost → DFC Attention → 
#            GhostConv → C3Ghost → DFC Attention → 
#            GhostConv → SPPF → C2PSA
# Output scales: P2/4, P3/8, P4/16, P5/32
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3Ghost, [128, True]]    # 2: C3Ghost module
  - [-1, 1, DFC_Attention, [128]]    # 3: DFC Attention at P2/4
  - [-1, 1, GhostConv, [256, 3, 2]]  # 4-P3/8
  - [-1, 2, C3Ghost, [256, True]]    # 5: C3Ghost module
  - [-1, 1, DFC_Attention, [256]]    # 6: DFC Attention at P3/8
  - [-1, 1, GhostConv, [512, 3, 2]]  # 7-P4/16
  - [-1, 2, C3Ghost, [512, True]]    # 8: C3Ghost module
  - [-1, 1, DFC_Attention, [512]]    # 9: DFC Attention at P4/16
  - [-1, 1, GhostConv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3Ghost, [1024, True]]   # 11: C3Ghost module
  - [-1, 1, SPPF, [1024, 5]]         # 12
  - [-1, 2, C2PSA, [1024]]           # 13: PSA attention

# Neck: DDPG + BiFPN_DWC (保持 YOLO_DDBC 的 Neck 结构)
# 注意：如果 DDPG 和 BiFPN_DWC 模块未实现，可以使用标准 FPN 结构
# 使用 backbone 输出的 P5(idx 13), P4(idx 7), P3(idx 4), P2(idx 1)
head:
  # 上采样 P5，与 P4 拼接
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 7], 1, Concat, [1]]                    # 15: cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 16 (FPN P4)

  # 上采样 P4，与 P3 拼接
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 4], 1, Concat, [1]]                    # 18: cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 19 (P3/8-small)

  # 下采样 P3，与 P4 拼接
  - [-1, 1, Conv, [256, 3, 2]]                   # 20
  - [[-1, 16], 1, Concat, [1]]                   # 21: cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 22 (P4/16-medium)

  # 下采样 P4，与 P5 拼接
  - [-1, 1, Conv, [512, 3, 2]]                   # 23
  - [[-1, 13], 1, Concat, [1]]                   # 24: cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                  # 25 (P5/32-large)

  # OBB detection head on three scales (P3/P4/P5)
  - [[19, 22, 25], 1, OBB, [nc, 1]]              # 26: Detect on P3, P4, P5
