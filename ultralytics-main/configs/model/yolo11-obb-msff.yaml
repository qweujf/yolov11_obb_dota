#
# Baseline YOLO11-OBB model equipped with MSFF + small-object detection head
# 该配置在基线模型头部接入第三个创新点（MSFF + 小目标检测头）
#
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 18  # DOTA-v2.0 类别数
scales:  # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # summary: 199 layers, ~3.1M params
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (baseline)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# YOLO11n head + MSFF small-object branch
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]]  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]]  # 22 (P5/32-large)

  # === MSFF + small-object head ===
  - [[16, 19, 22], 1, MSFFBlock, [[256, 512, 1024], 256]]  # 23 -> [P2,P3,P4,P5]
  - [23, 1, Index, [0]]  # 24: P2 (high-res)
  - [23, 1, Index, [1]]  # 25: refined P3
  - [23, 1, Index, [2]]  # 26: refined P4
  - [23, 1, Index, [3]]  # 27: refined P5
  - [24, 1, SmallObjectHead, [256, 128]]  # 28: small-object focused feature

  - [[28, 25, 26, 27], 1, OBB, [nc, 1]]  # Detect on four scales (P2~P5)


