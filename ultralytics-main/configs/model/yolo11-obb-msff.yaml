# YOLO11-OBB with Lightweight Multi-Scale Feature Fusion (LightMSFF)
# This config enhances P3/P4/P5 features through lightweight fusion
# without adding extra detection heads.

# Parameters
nc: 15  # DOTA dataset classes
scales:
  n: [0.25, 2.0, 1024]

# YOLO11n-obb backbone (unchanged from baseline)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# YOLO11n-obb head with LightMSFF
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]  # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]  # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]  # 17
  - [[-1, 13], 1, Concat, [1]]  # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  # 20
  - [[-1, 10], 1, Concat, [1]]  # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]  # 22 (P5/32-large)

  # === MSFF: Multi-Scale Feature Fusion (Medium strength) ===
  # Takes P3(16), P4(19), P5(22) and returns enhanced P3', P4', P5'
  # Uses 128 fusion channels for better accuracy (can be pruned later)
  - [[16, 19, 22], 1, MSFF, [128]]  # 23: outputs tuple (P3', P4', P5')

  # Extract enhanced features from LightMSFF output
  - [23, 1, Index, [0]]  # 24: enhanced P3
  - [23, 1, Index, [1]]  # 25: enhanced P4
  - [23, 1, Index, [2]]  # 26: enhanced P5

  # OBB detection head on three scales (P3/P4/P5)
  - [[24, 25, 26], 1, OBB, [nc, 1]]  # 27: Detect on P3, P4, P5
