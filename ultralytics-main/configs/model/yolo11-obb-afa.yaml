# YOLO11-OBB with Adaptive Feature Alignment (AFA)
# AFA is inserted in FPN before Concat operations to align and enhance features

# Parameters
nc: 15  # DOTA dataset classes
scales:
  n: [0.25, 0.25, 1024]  # depth_multiple, width_multiple, max_channels (yolo11n standard)

# YOLO11n-obb backbone (unchanged from baseline)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# YOLO11n-obb head with AFA (in FPN, before Concat)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  # AFA: align P5 (upsampled) with P4 before concat
  - [[-1, 6], 1, AFA, [512]]  # 12: align and enhance before concat
  - [-1, 2, C3k2, [512, False]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  # AFA: align P4 (upsampled) with P3 before concat
  - [[-1, 4], 1, AFA, [256]]  # 15: align and enhance before concat
  - [-1, 2, C3k2, [256, False]]  # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]  # 17
  # AFA: align P3 (downsampled) with P4 before concat
  - [[-1, 13], 1, AFA, [512]]  # 18: align and enhance before concat
  - [-1, 2, C3k2, [512, False]]  # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  # 20
  # AFA: align P4 (downsampled) with P5 before concat
  - [[-1, 10], 1, AFA, [1024]]  # 21: align and enhance before concat
  - [-1, 2, C3k2, [1024, True]]  # 22 (P5/32-large)

  # OBB detection head on three scales (P3/P4/P5)
  - [[16, 19, 22], 1, OBB, [nc, 1]]  # 23: Detect on P3, P4, P5

