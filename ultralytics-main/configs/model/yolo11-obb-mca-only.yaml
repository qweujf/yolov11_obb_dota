# MCAttention-only YOLO11-obb model (for ablation study)
# 仅包含 MCAttention 的 YOLO11-OBB 模型（用于消融实验）
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 18 # DOTA-v2.0数据集类别数
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 196 layers, 2695747 parameters, 2695731 gradients, 6.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 196 layers, 9744931 parameters, 9744915 gradients, 22.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 246 layers, 20963523 parameters, 20963507 gradients, 72.2 GFLOPs
  l: [1.00, 1.00, 512] # summary: 372 layers, 26220995 parameters, 26220979 gradients, 91.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 372 layers, 58875331 parameters, 58875315 gradients, 204.3 GFLOPs

# YOLO11n backbone with MCAttention (only)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, MCAttention, [256, [3, 5, 7], 16, 8]] # 3-多尺度交叉轴注意力
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, MCAttention, [512, [3, 5, 7], 16, 8]] # 6-多尺度交叉轴注意力
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, MCAttention, [512, [3, 5, 7], 16, 8]] # 9-多尺度交叉轴注意力
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 12
  - [-1, 2, C2PSA, [1024]] # 13-原始PSA注意力
  - [-1, 1, MCAttention, [1024, [3, 5, 7, 9], 16, 8]] # 14-增强的多尺度注意力

# YOLO11n head with standard FPN (no AdaptiveFPN)
head:
  # 使用标准FPN，不使用AdaptiveFPN
  # Backbone 层索引: 0-14
  # 0: Conv(64), 1: Conv(128), 2-3: C3k2(256), 3: MCAttention(256), 4: Conv(256) P3
  # 5-6: C3k2(512), 6: MCAttention(512), 7: Conv(512) P4
  # 8-9: C3k2(512), 9: MCAttention(512), 10: Conv(1024) P5
  # 11-12: C3k2(1024), 13: SPPF(1024), 14: C2PSA(1024), 15: MCAttention(1024)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 7], 1, Concat, [1]] # 16 cat backbone P4 (索引7是Conv(512))
  - [-1, 2, C3k2, [512, False]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 4], 1, Concat, [1]] # 19 cat backbone P3 (索引4是Conv(256))
  - [-1, 2, C3k2, [256, False]] # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # 22 cat head P4 (索引17)
  - [-1, 2, C3k2, [512, False]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 14], 1, Concat, [1]] # 25 cat head P5 (backbone索引14是最后一个MCAttention)
  - [-1, 2, C3k2, [1024, True]] # 26 (P5/32-large)

  - [[20, 23, 26], 1, OBB, [nc, 1]] # 27 Detect(P3, P4, P5)

